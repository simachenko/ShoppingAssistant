# Render Blueprint — one free-tier web service per deployable, per plan.md.
# Actual secret values (connection strings, LLM provider key, OTLP backend credentials) are set
# in the Render dashboard/environment groups, never committed here (constitution Principle I).
services:
  - type: web
    name: catalog-api
    runtime: docker
    dockerfilePath: ./src/ProductCatalog/ProductCatalog.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__catalogdb
        sync: false
      - key: InternalApiKey
        sync: false
      # Points every service's OpenTelemetry export at a free-tier OTLP backend (e.g. Grafana
      # Cloud) in place of the local-only Aspire Dashboard (FR-027/FR-028, research.md §16).
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: pricing-api
    runtime: docker
    dockerfilePath: ./src/PricingAvailability/PricingAvailability.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__pricingdb
        sync: false
      - key: InternalApiKey
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: advisor-api
    runtime: docker
    dockerfilePath: ./src/ProductAdvisor/ProductAdvisor.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__advisordb
        sync: false
      # Free Render web services cannot receive private-network traffic. Copy each service's
      # public hostname instead: HTTPS requests to it also wake a sleeping free instance.
      - key: RenderExternalHosts__catalog-api
        fromService:
          name: catalog-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: RenderExternalHosts__pricing-api
        fromService:
          name: pricing-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: LlmProvider__Endpoint
        sync: false
      - key: LlmProvider__ApiKey
        sync: false
      # The embedding model behind store-policy retrieval (002 research.md §7). Its output
      # dimension MUST match the `vector(1536)` column the migration declares — changing to a
      # different-dimension model needs a new migration, not just a new value here.
      - key: LlmProvider__EmbeddingModel
        sync: false
      # Populates the demo store-policy knowledge base on first start. Without it advisor-api runs
      # fine but every store-policy question honestly answers "not found" (002 FR-009), because the
      # index is empty — set to false once real content is ingested instead.
      - key: SeedDemoData
        sync: false
      - key: LlmProvider__Model
        sync: false
      - key: InternalApiKey
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: gateway-api
    runtime: docker
    dockerfilePath: ./src/Gateway/Gateway.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RenderExternalHosts__catalog-api
        fromService:
          name: catalog-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: RenderExternalHosts__pricing-api
        fromService:
          name: pricing-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: RenderExternalHosts__advisor-api
        fromService:
          name: advisor-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: InternalApiKey
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: webapp
    runtime: docker
    dockerfilePath: ./src/WebApp/WebApp.Blazor/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RenderExternalHosts__gateway-api
        fromService:
          name: gateway-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
