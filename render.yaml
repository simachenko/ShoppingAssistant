# Render Blueprint — one free-tier web service per deployable, per plan.md.
# Actual secret values (connection strings, LLM provider key, OTLP backend credentials) are set
# in the Render dashboard/environment groups, never committed here (constitution Principle I).
services:
  - type: web
    name: catalog-api
    runtime: docker
    dockerfilePath: ./src/ProductCatalog/ProductCatalog.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__catalogdb
        sync: false
      - key: InternalApiKey
        sync: false
      # Points every service's OpenTelemetry export at a free-tier OTLP backend (e.g. Grafana
      # Cloud) in place of the local-only Aspire Dashboard (FR-027/FR-028, research.md §16).
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: pricing-api
    runtime: docker
    dockerfilePath: ./src/PricingAvailability/PricingAvailability.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__pricingdb
        sync: false
      - key: InternalApiKey
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: advisor-api
    runtime: docker
    dockerfilePath: ./src/ProductAdvisor/ProductAdvisor.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__advisordb
        sync: false
      - key: services__catalog-api__http__0
        fromService:
          name: catalog-api
          type: web
          property: hostport
      - key: services__pricing-api__http__0
        fromService:
          name: pricing-api
          type: web
          property: hostport
      - key: LlmProvider__Endpoint
        sync: false
      - key: LlmProvider__ApiKey
        sync: false
      - key: LlmProvider__Model
        sync: false
      - key: InternalApiKey
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: gateway-api
    runtime: docker
    dockerfilePath: ./src/Gateway/Gateway.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /alive
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: services__catalog-api__http__0
        fromService:
          name: catalog-api
          type: web
          property: hostport
      - key: services__pricing-api__http__0
        fromService:
          name: pricing-api
          type: web
          property: hostport
      - key: services__advisor-api__http__0
        fromService:
          name: advisor-api
          type: web
          property: hostport
      - key: InternalApiKey
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

  - type: web
    name: webapp
    runtime: docker
    dockerfilePath: ./src/WebApp/WebApp.Blazor/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: services__gateway-api__http__0
        fromService:
          name: gateway-api
          type: web
          property: hostport
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # The .NET SDK defaults to gRPC; Grafana Cloud's OTLP gateway (and most managed OTLP
      # endpoints) speak HTTP/protobuf instead — without this, export fails silently.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
